# Qualify — full stack in Docker.
#
#   docker compose up --build -d     → http://localhost:5000
#   docker compose logs -f app       → follow the app logs
#   docker compose down              → stop (data is kept in the qualify-data volume)
#   docker compose down -v           → stop and delete the database
#
# Settings come from your .env file (or the shell). Only the ones below are used here;
# DATABASE_URL is always pointed at the bundled PostgreSQL container.

x-db-url: &db-url postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/qualify?schema=public

services:
  db:
    image: postgres:16-alpine
    container_name: qualify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: qualify
    ports:
      # Exposed for local tools (psql, Prisma Studio). Change DB_PORT if 5432 is taken.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - qualify-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qualify"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once: applies migrations, then loads demo data if the database is empty.
  migrate:
    build:
      context: .
      target: migrate
    container_name: qualify-migrate
    environment:
      DATABASE_URL: *db-url
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: qualify-app
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: *db-url
      PORT: 3100
      APP_URL: ${APP_URL:-http://localhost:3100}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-30}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  qualify-data:
